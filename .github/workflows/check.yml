name: Check Skill bundle
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -B tools/check_bundle.py
      - run: python -B -m unittest discover -s skills/vertical-comic-preproduction/tests
      - run: python -B -m unittest discover -s tests
